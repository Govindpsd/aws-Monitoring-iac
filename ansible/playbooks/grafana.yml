# ansible/playbooks/grafana.yml
- name: Install and configure Grafana
  hosts: prometheus
  become: yes
  tasks:
    # --------------------------------------------------------------------
    # 1️⃣ Install dependencies
    # --------------------------------------------------------------------
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - software-properties-common
          - wget
        state: present
        update_cache: yes

    # --------------------------------------------------------------------
    # 2️⃣ Add Grafana APT repo
    # --------------------------------------------------------------------
    - name: Add Grafana GPG key
      ansible.builtin.apt_key:
        url: https://packages.grafana.com/gpg.key
        state: present

    - name: Add Grafana APT repository
      ansible.builtin.apt_repository:
        repo: "deb https://packages.grafana.com/oss/deb stable main"
        state: present

    # --------------------------------------------------------------------
    # 3️⃣ Install Grafana
    # --------------------------------------------------------------------
    - name: Install Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes

    # --------------------------------------------------------------------
    # 4️⃣ Enable and start Grafana service
    # --------------------------------------------------------------------
    - name: Enable and start Grafana service
      systemd:
        name: grafana-server
        enabled: yes
        state: started

    # --------------------------------------------------------------------
    # 5️⃣ Configure Prometheus as Grafana data source
    # --------------------------------------------------------------------
    - name: Create Prometheus data source configuration
      copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: false

    # --------------------------------------------------------------------
    # 6️⃣ Reload Grafana
    # --------------------------------------------------------------------
    - name: Restart Grafana service
      systemd:
        name: grafana-server
        state: restarted

