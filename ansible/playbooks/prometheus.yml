# ansible/playbooks/prometheus.yml
- name: Install and configure Prometheus on Monitoring VM
  hosts: prometheus
  become: yes
  tasks:
    # --------------------------------------------------------------------
    # 1️⃣ Download and install Prometheus
    # --------------------------------------------------------------------
    - name: Download Prometheus binary
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
        dest: /tmp/prometheus.tar.gz

    - name: Extract Prometheus archive
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /opt/
        remote_src: yes

    - name: Rename extracted folder (if needed)
      shell: |
        set -e
        EXTRACTED_DIR=$(find /opt -maxdepth 1 -type d -name "prometheus-*")
        if [ -n "$EXTRACTED_DIR" ] && [ ! -d /opt/prometheus ]; then
          mv "$EXTRACTED_DIR" /opt/prometheus
        fi
      args:
        executable: /bin/bash

    # --------------------------------------------------------------------
    # 2️⃣ Create Prometheus alert rules file
    # --------------------------------------------------------------------
    - name: Create Prometheus alert rules file
      copy:
        dest: /opt/prometheus/alert_rules.yml
        content: |
          {% raw %}
          groups:
            - name: node_alerts
              rules:
                - alert: InstanceDown
                  expr: up == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Instance {{$labels.instance}} is down"
                    description: "Target {{$labels.instance}} has been unreachable for more than 1 minute"

                - alert: HighCPUUsage
                  expr: 100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "High CPU usage detected on {{$labels.instance}}"
                    description: "CPU usage has been above 90% for more than 5 minutes"

                - alert: WebsiteDown
                  expr: probe_success == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Website {{$labels.instance}} is down"
                    description: "Blackbox probe failed for {{$labels.instance}} for more than 1 minute"
          {% endraw %}

    # --------------------------------------------------------------------
    # 3️⃣ Create Prometheus main configuration (scrape + alerting + Blackbox)
    # --------------------------------------------------------------------
    - name: Create Prometheus configuration file
      copy:
        dest: /opt/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s

          alerting:
            alertmanagers:
              - static_configs:
                  - targets: ['localhost:9093']

          rule_files:
            - "/opt/prometheus/alert_rules.yml"

          scrape_configs:
            - job_name: "prometheus"
              static_configs:
                - targets: ["localhost:9090"]

            - job_name: "node_exporter"
              static_configs:
                - targets: ["{{ hostvars['target'].ansible_host }}:9100"]

            - job_name: "blackbox"
              metrics_path: /probe
              params:
                module: [http_2xx]
              static_configs:
                - targets:
                    - http://govindpsd.github.io    # your portfolio site
                    - https://www.google.com        # example check
              relabel_configs:
                - source_labels: [__address__]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: __address__
                  replacement: "localhost:9115"  # Blackbox Exporter runs locally

    # --------------------------------------------------------------------
    # 4️⃣ Create Prometheus systemd service
    # --------------------------------------------------------------------
    - name: Create Prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus Monitoring
          After=network.target

          [Service]
          ExecStart=/opt/prometheus/prometheus \
            --config.file=/opt/prometheus/prometheus.yml \
            --storage.tsdb.path=/opt/prometheus/data
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      command: systemctl daemon-reload

    - name: Enable and start Prometheus service
      systemd:
        name: prometheus
        enabled: yes
        state: restarted
